<!DOCTYPE html>
<html>

<head>

    <title>Food Order System</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<div class="container">

    <h1>🍔 Food Order System</h1>

    <form
        class="order-form"
        action="/order"
        method="post"
    >

        <div class="form-group">

            <label>
                Customer Name
            </label>

            <input
                type="text"
                name="customer"
                placeholder="Enter your name"
                required
            >

        </div>

        <div class="form-group">

            <label>
                Food Item
            </label>

            <input
                type="text"
                name="food"
                placeholder="Enter food item"
                required
            >

        </div>

        <div class="form-group">

            <label>
                Quantity
            </label>

            <input
                type="number"
                name="quantity"
                placeholder="Enter quantity"
                required
            >

        </div>

        <div class="button-group">

            <button type="submit">
                Place Order
            </button>

        </div>

    </form>

    <div class="dashboard-link">

        <a
            class="view-orders-btn"
            href="/orders"
        >
            View Orders Dashboard
        </a>

    </div>

</div>

</body>

</html>
