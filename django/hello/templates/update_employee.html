<!DOCTYPE html>
<html>
<head>
    <title>Update Employee</title>
</head>
<body>

<h2>Update Employee</h2>

<form method="POST">
    {% csrf_token %}

    <label>Name:</label>
    <input type="text" name="name" value="{{ emp.name }}" required><br><br>

    <label>Age:</label>
    <input type="number" name="age" value="{{ emp.age }}" required><br><br>

    <label>Email:</label>
    <input type="email" name="email" value="{{ emp.email }}"><br><br>

    <label>Salary:</label>
    <input type="number" name="salary" value="{{ emp.salary }}" required><br><br>

    <label>Designation:</label>
    <input type="text" name="designation" value="{{ emp.designation }}" required><br><br>

    <button type="submit">Update</button>
</form>

<br>
<a href="/">Back</a>

</body>
</html>
