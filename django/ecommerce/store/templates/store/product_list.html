{% extends 'store/index.html' %}
{% load static %}

{% block content %}

<h2>Products</h2>

<div class="products">
    {% for product in products %}
    <div class="card">
        <h3>{{ product.name }}</h3>
        <p>₹{{ product.price }}</p>
        <button onclick="addToCart({{ product.id }})">Add to Cart</button>
    </div>
    {% endfor %}
</div>

<script src="{% static 'store/js/app.js' %}"></script>

{% endblock %}
